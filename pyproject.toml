[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-intelligence"
version = "0.1.0"
description = "Multi-Modal Chest X-Ray Intelligence System (Report Generation + RAG QA)"
requires-python = ">=3.10"
# Runtime dependencies are pinned in requirements.txt to keep the two
# install paths (local M1 vs Colab GPU) independently controllable.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cxr = ["../config.yaml"]
